name: ci

# `push` cubre la rama principal y las de trabajo. `pull_request` hace que el
# rojo se vea ANTES de mergear, no despues.
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Los tests unitarios (inventario/FIFO, topes de fiado, merge de sync,
      # journal SQLite, parser de SMS) solo se ejecutaban a mano. Si el push
      # rompe uno, el rojo tiene que verse aqui y no en el proximo release.
      - name: Tests
        run: pnpm run test

      # Misma verificación que usa el job migrate-db del release: si se editó
      # un schema sin generar su migración, se ve en el push y no al etiquetar.
      - name: Migraciones al día
        uses: ./.github/actions/check-migraciones

  # Pruebas de API contra un servidor real y Postgres de verdad. El runner
  # (tests/api/run.mjs) crea la BD MiQuiosco_test, la migra, la siembra, levanta
  # `nuxt dev` y ejecuta las suites. Sin este job, los 84 endpoints no tienen
  # ninguna prueba automatica.
  # PROBE 2: job completo sin services (aislar el startup_failure).
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # PROBE 4: setup-bun pineado por SHA (v2.1.3). El tag flotante @v2 rompia el
      # scheduler con startup_failure y cero jobs, aun existiendo la ref.
      - name: Install bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests de API
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: ci-test-secret-que-tiene-mas-de-32-caracteres
        run: pnpm run test:api
