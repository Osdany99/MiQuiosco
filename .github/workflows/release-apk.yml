name: release-apk

# Genera la APK firmada de producción desde un tag: v{versionName}.{versionCode}
# Ejemplo: v1.2.3 → versionName "1.2", versionCode 3.
# El "+" está prohibido en tags/assets: GitHub devuelve 404 en la descarga
# directa (/releases/download/) aunque el asset exista.
# Cadena de jobs: migrate-db (migra Neon) → build-release (APK + GitHub
# Release) → sync-vercel (variables + redeploy + verificación).
# El APK se publica como asset del GitHub Release (ya no se commitea a public/apk).
on:
  push:
    tags:
      - 'v*'

# Dos tags seguidos no migran la BD a la vez: el segundo espera.
concurrency:
  group: production-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Migra la BD de producción (Neon) con drizzle-kit migrate: versionado,
  # journaled e idempotente (si ya está al día, no hace nada). Si falla, el
  # release se aborta aquí: no se compila ni se publica nada.
  # Regla: solo migraciones aditivas (expand-only). Lo destructivo es manual
  # (ver Caso C en docs/PUBLICAR_VERSION.md).
  migrate-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verificar secret de BD
        shell: bash
        env:
          HAS_DB_URL: ${{ secrets.DATABASE_URL_PROD != '' }}
        run: |
          if [[ "${HAS_DB_URL}" != "true" ]]; then
            echo "::error::Falta el secret DATABASE_URL_PROD (URL directa de Neon, no pooled). Ver docs/PUBLICAR_VERSION.md"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Sin input 'version': usa packageManager de package.json (pnpm@11.5.2).

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verificar que las migraciones estén commiteadas
        uses: ./.github/actions/check-migraciones

      - name: Migrar producción
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: pnpm db:migrate

  build-release:
    needs: [migrate-db]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parsear tag (vX.Y.N)
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: ${TAG}"
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::El tag debe tener formato v{versionName}.{versionCode} (ej. v1.2.3 → versionName \"1.2\", versionCode 3). Recibido: ${TAG}"
            exit 1
          fi
          VERSION_NAME="${BASH_REMATCH[1]}"
          VERSION_CODE="${BASH_REMATCH[2]}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=miquiosco-v${VERSION_NAME}.${VERSION_CODE}.apk" >> "${GITHUB_OUTPUT}"

      - name: Verificar secretos de firma
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD != '' }}
        run: |
          if [[ "${HAS_KEYSTORE}" != "true" || "${HAS_STORE_PASS}" != "true" || "${HAS_ALIAS}" != "true" || "${HAS_KEY_PASS}" != "true" ]]; then
            echo "::error::Faltan secretos de firma (ANDROID_KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_ALIAS, KEYSTORE_KEY_PASSWORD). Ver docs/PUBLICAR_VERSION.md"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # El default del action ('tools platform-tools') incluye el paquete
          # obsoleto 'tools', que ya no existe y rompe sdkmanager (exit 1).
          # Se listan solo paquetes vigentes para compileSdk 36.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: 'false'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Sin input 'version': usa packageManager de package.json (pnpm@11.5.2).
        # Ponerlo choca con ese campo ("Multiple versions of pnpm specified").

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fijar versionCode/versionName desde el tag
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -n -E "versionCode |versionName " android/app/build.gradle

      - name: Build web de producción
        env:
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
          NUXT_PUBLIC_SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
        run: pnpm build

      - name: Capacitor sync
        run: pnpm cap:sync

      - name: Verificar URL de producción en assets
        shell: bash
        run: |
          HTML="android/app/src/main/assets/public/index.html"
          if grep -q "127.0.0.1\|localhost" "${HTML}"; then
            echo "::error::Los assets llevan URL local (localhost). Revisa el secret SYNC_SERVER_URL."
            exit 1
          fi
          echo "Assets con URL de producción OK."

      - name: Restaurar keystore de firma
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "${KEYSTORE_B64}" | base64 -d > android/miquiosco-prod.jks
          printf 'storeFile=miquiosco-prod.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${STORE_PASS}" "${KEY_ALIAS}" "${KEY_PASS}" > android/keystore.properties
          ls -la android/miquiosco-prod.jks android/keystore.properties

      - name: Compilar APK release
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --console=plain

      - name: Verificar firma (apksigner)
        shell: bash
        run: |
          APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "${APKSIGNER}" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Renombrar APK
        shell: bash
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          ls -la "${APK_NAME}"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.version.outputs.apk_name }}
          generate_release_notes: true
          body: |
            APK firmada de producción generada automáticamente desde el tag `${{ github.ref_name }}`.
            El job `sync-vercel` actualiza Vercel solo (variables + redeploy). Ver `docs/PUBLICAR_VERSION.md`.

  # Actualiza Vercel sin tocar el dashboard: variables de versión (upsert),
  # redeploy a producción y verificación del manifiesto /api/app-version.
  # Política: MIN_VERSION_CODE = LATEST (actualización obligatoria). Si una
  # versión debe ser opcional, bajar APP_MIN_VERSION_CODE en el dashboard.
  # El changelog sale del cuerpo del tag anotado (git tag -a -m titulo -m notas).
  sync-vercel:
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Calcular versión, changelog y URL del asset
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag con formato inesperado: ${TAG} (se espera vX.Y.N)."
            exit 1
          fi
          VERSION_NAME="${BASH_REMATCH[1]}"
          VERSION_CODE="${BASH_REMATCH[2]}"
          APK_NAME="miquiosco-v${VERSION_NAME}.${VERSION_CODE}.apk"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force --quiet
          CHANGELOG="$(git tag -l --format='%(contents:body)' "${TAG}" | sed -e 's/^[[:space:]]*//')"
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "apk_url=https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}"
            echo "changelog<<EOF_CHANGELOG"
            printf '%s\n' "${CHANGELOG}"
            echo "EOF_CHANGELOG"
          } >> "${GITHUB_OUTPUT}"

      - name: Actualizar variables en Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_URL: ${{ steps.meta.outputs.apk_url }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
        run: |
          PROJECT_ID="$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            'https://api.vercel.com/v9/projects' | jq -r '.projects[] | select(.name=="mi-quiosco") | .id')"
          if [[ -z "${PROJECT_ID}" ]]; then
            echo "::error::No se encontró el proyecto mi-quiosco en Vercel."
            exit 1
          fi
          echo "PROJECT_ID=${PROJECT_ID}" >> "${GITHUB_ENV}"
          PAYLOAD="$(jq -n \
            --arg code "${VERSION_CODE}" \
            --arg name "${VERSION_NAME}" \
            --arg url "${APK_URL}" \
            --arg log "${CHANGELOG}" \
            '[{"key":"APP_LATEST_VERSION_CODE","value":$code},
              {"key":"APP_LATEST_VERSION_NAME","value":$name},
              {"key":"APP_MIN_VERSION_CODE","value":$code},
              {"key":"APP_APK_URL","value":$url},
              {"key":"APP_CHANGELOG","value":$log}]
              | map(. + {type:"plain", target:["production","preview"]})')"
          RESP="$(curl -sS -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?upsert=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" -d "${PAYLOAD}")"
          FAILED="$(echo "${RESP}" | jq -r '.failed | length')"
          if [[ "${FAILED}" != "0" ]]; then
            echo "::error::Falló el upsert de variables en Vercel: ${RESP}"
            exit 1
          fi
          echo "Variables actualizadas en Vercel."

      - name: Redeploy en Vercel y esperar READY
        # Sin Vercel CLI (se cuelga en CI): la API pública no tiene "redeploy",
        # pero crear un deployment de producción desde git equivale a lo mismo
        # y toma las variables recién actualizadas.
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          DEPLOY_ID="$(curl -sS -X POST 'https://api.vercel.com/v13/deployments' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg p "${PROJECT_ID}" --arg o "${{ github.repository_owner }}" \
              --arg r "${REPO_NAME}" --arg b "${DEFAULT_BRANCH}" \
              '{name:"mi-quiosco", project:$p, target:"production",
                gitSource:{type:"github", org:$o, repo:$r, ref:$b}}')" \
            | jq -r '.id')"
          echo "Deployment: ${DEPLOY_ID}"
          STATE=""
          for i in $(seq 1 40); do
            STATE="$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${DEPLOY_ID}" | jq -r '.status')"
            echo "Intento ${i}: ${STATE}"
            if [[ "${STATE}" == "READY" ]]; then break; fi
            if [[ "${STATE}" == "ERROR" || "${STATE}" == "CANCELED" ]]; then
              echo "::error::El redeploy terminó en estado ${STATE}."
              exit 1
            fi
            sleep 15
          done
          if [[ "${STATE}" != "READY" ]]; then
            echo "::error::Timeout esperando READY (último estado: ${STATE})."
            exit 1
          fi

      - name: Verificar manifiesto en producción
        shell: bash
        env:
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          BASE_URL: ${{ secrets.SYNC_SERVER_URL }}
        run: |
          sleep 10
          CODE="$(curl -sS "${BASE_URL}/api/app-version" | jq -r '.latestVersionCode')"
          echo "latestVersionCode en producción: ${CODE} (esperado: ${VERSION_CODE})"
          if [[ "${CODE}" != "${VERSION_CODE}" ]]; then
            echo "::error::El manifiesto no refleja la nueva versión."
            exit 1
          fi
          echo "Manifiesto verificado."
