name: release-apk

# Genera la APK firmada de producción desde un tag: v{versionName}.{versionCode}
# Ejemplo: v1.2.3 → versionName "1.2", versionCode 3.
# El "+" está prohibido en tags/assets: GitHub devuelve 404 en la descarga
# directa (/releases/download/) aunque el asset exista.
# Cadena de jobs: migrate-db (migra Neon) → build-release (APK + GitHub
# Release) → sync-vercel (variables + redeploy + verificación).
# El APK se publica como asset del GitHub Release (ya no se commitea a public/apk).
on:
  push:
    tags:
      - 'v*'

# Dos tags seguidos no migran la BD a la vez: el segundo espera.
concurrency:
  group: production-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Migra la BD de producción (Neon) con drizzle-kit migrate: versionado,
  # journaled e idempotente (si ya está al día, no hace nada). Si falla, el
  # release se aborta aquí: no se compila ni se publica nada.
  # Regla: solo migraciones aditivas (expand-only). Lo destructivo es manual
  # (ver Caso C en docs/PUBLICAR_VERSION.md).
  migrate-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verificar secret de BD
        shell: bash
        env:
          HAS_DB_URL: ${{ secrets.DATABASE_URL_PROD != '' }}
        run: |
          if [[ "${HAS_DB_URL}" != "true" ]]; then
            echo "::error::Falta el secret DATABASE_URL_PROD (URL directa de Neon, no pooled). Ver docs/PUBLICAR_VERSION.md"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Sin input 'version': usa packageManager de package.json (pnpm@11.5.2).

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verificar que las migraciones estén commiteadas
        uses: ./.github/actions/check-migraciones

      # Gate antes de tocar producción: si los tests o el typecheck fallan, el
      # release se aborta aquí y Neon no se migra. Publicar con el árbol en rojo
      # es justo lo que el workflow debe impedir.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Migrar producción
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: pnpm db:migrate

  build-release:
    needs: [migrate-db]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parsear tag (vX.Y.N)
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: ${TAG}"
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::El tag debe tener formato v{versionName}.{versionCode} (ej. v1.2.3 → versionName \"1.2\", versionCode 3). Recibido: ${TAG}"
            exit 1
          fi
          VERSION_NAME="${BASH_REMATCH[1]}"
          VERSION_CODE="${BASH_REMATCH[2]}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=miquiosco-v${VERSION_NAME}.${VERSION_CODE}.apk" >> "${GITHUB_OUTPUT}"

      - name: Verificar secretos de firma
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD != '' }}
        run: |
          if [[ "${HAS_KEYSTORE}" != "true" || "${HAS_STORE_PASS}" != "true" || "${HAS_ALIAS}" != "true" || "${HAS_KEY_PASS}" != "true" ]]; then
            echo "::error::Faltan secretos de firma (ANDROID_KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_ALIAS, KEYSTORE_KEY_PASSWORD). Ver docs/PUBLICAR_VERSION.md"
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # El default del action ('tools platform-tools') incluye el paquete
          # obsoleto 'tools', que ya no existe y rompe sdkmanager (exit 1).
          # Se listan solo paquetes vigentes para compileSdk 36.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: 'false'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Sin input 'version': usa packageManager de package.json (pnpm@11.5.2).
        # Ponerlo choca con ese campo ("Multiple versions of pnpm specified").

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fijar versionCode/versionName desde el tag
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -n -E "versionCode |versionName " android/app/build.gradle

      - name: Build web de producción
        env:
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
          NUXT_PUBLIC_SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
        run: pnpm build

      # Bundle web (OTA): el mismo HTML/JS/CSS que va dentro de la APK, pero
      # empaquetado aparte para que un cambio de pantalla o de lógica no obligue
      # a instalar 19 MB. Se publica junto al APK en el mismo release.
      - name: Empaquetar el bundle web
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          WEB_ZIP="web-v${VERSION_CODE}.zip"
          ( cd .output/public && zip -q -r "../../${WEB_ZIP}" . )
          ls -la "${WEB_ZIP}"
          if ! unzip -l "${WEB_ZIP}" | grep -qE " (\./)?index\.html$"; then
            echo "::error::El bundle web no lleva index.html en la raíz; el plugin lo rechazaría."
            exit 1
          fi
          # Un APK viejo dentro de public/apk engordaría el OTA sin motivo.
          if unzip -l "${WEB_ZIP}" | grep -qE "apk/.*\.apk$"; then
            echo "::error::El bundle web incluye un APK en apk/. Bórralo de public/apk/."
            exit 1
          fi

      - name: Capacitor sync
        run: pnpm cap:sync

      - name: Verificar URL de producción en assets
        shell: bash
        run: |
          HTML="android/app/src/main/assets/public/index.html"
          if grep -q "127.0.0.1\|localhost" "${HTML}"; then
            echo "::error::Los assets llevan URL local (localhost). Revisa el secret SYNC_SERVER_URL."
            exit 1
          fi
          echo "Assets con URL de producción OK."

      - name: Restaurar keystore de firma
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "${KEYSTORE_B64}" | base64 -d > android/miquiosco-prod.jks
          printf 'storeFile=miquiosco-prod.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${STORE_PASS}" "${KEY_ALIAS}" "${KEY_PASS}" > android/keystore.properties
          ls -la android/miquiosco-prod.jks android/keystore.properties

      - name: Compilar APK release
        shell: bash
        run: |
          chmod +x android/gradlew
          # gradle-daemon-jvm.properties fija el daemon a JBR 21 vía foojay
          # con ids que pueden caducar (400 el 2026-10-06 y tumbó el release
          # v2.0.8). En CI se usa el JDK 21 ya instalado (JAVA_HOME): sin ese
          # archivo Gradle no intenta descargar nada. El archivo local no se
          # toca (solo existe en el runner).
          rm -f android/gradle/gradle-daemon-jvm.properties
          cd android && ./gradlew assembleRelease --console=plain

      - name: Verificar firma (apksigner)
        shell: bash
        run: |
          APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "${APKSIGNER}" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Renombrar APK
        shell: bash
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          ls -la "${APK_NAME}"

      # El modelo Vosk (38 MB) se publica aparte, en el release permanente
      # `modelo-vosk-v1`. Si alguien vuelve a dejarlo en assets/ la APK engorda
      # sin que nadie lo note hasta la descarga, así que se falla aquí.
      - name: Verificar que la APK no lleva el modelo Vosk
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if unzip -l "${APK}" | grep -q "assets/vosk/vosk-es.zip"; then
            echo "::error::La APK incluye assets/vosk/vosk-es.zip (38 MB). El modelo se publica en el release modelo-vosk-v1 y se descarga en el primer uso. Bórralo de android/app/src/main/assets/vosk/."
            exit 1
          fi
          MB="$(du -m "${APK}" | cut -f1)"
          echo "APK: ${MB} MB (sin el modelo Vosk)"
          if [[ "${MB}" -gt 30 ]]; then
            echo "::error::La APK pesa ${MB} MB; se esperaban menos de 30 MB sin el modelo Vosk."
            exit 1
          fi

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ steps.version.outputs.apk_name }}
            web-v${{ steps.version.outputs.version_code }}.zip
          generate_release_notes: true
          body: |
            APK firmada de producción generada automáticamente desde el tag `${{ github.ref_name }}`.
            El job `sync-vercel` actualiza Vercel solo (variables + redeploy). Ver `docs/PUBLICAR_VERSION.md`.

  # Actualiza Vercel sin tocar el dashboard: variables de versión (upsert),
  # redeploy a producción y verificación del manifiesto /api/app-version.
  # Política: MIN_VERSION_CODE = 0 (actualización OPCIONAL). La app ofrece la
  # versión nueva como descartable ("Más tarde", no vuelve a insistir) y el
  # servidor nunca responde 426: una APK vieja sigue trabajando.
  # Para hacer una release obligatoria, pon aquí el code de esa versión
  # (MIN_VERSION_CODE = LATEST) y revísalo en docs/PUBLICAR_VERSION.md.
  # El changelog sale del cuerpo del tag anotado (git tag -a -m titulo -m notas).
  sync-vercel:
    needs: [build-release]
    runs-on: ubuntu-latest
    env:
      # versionCode del APK más viejo compatible con el bundle web. Súbelo SOLO
      # cuando el bundle estrene algo nativo (plugin, permiso, cambio en Java):
      # los equipos por debajo se quedan con su bundle hasta instalar la APK.
      # Con cambios nativos de voz en esta versión, el primero compatible es 23 (v2.4.23).
      WEB_APK_MINIMA: '23'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Calcular versión, changelog y URL del asset
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag con formato inesperado: ${TAG} (se espera vX.Y.N)."
            exit 1
          fi
          VERSION_NAME="${BASH_REMATCH[1]}"
          VERSION_CODE="${BASH_REMATCH[2]}"
          APK_NAME="miquiosco-v${VERSION_NAME}.${VERSION_CODE}.apk"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force --quiet
          CHANGELOG="$(git tag -l --format='%(contents:body)' "${TAG}" | sed -e 's/^[[:space:]]*//')"
          # Modelo de voz offline: release permanente e independiente del APK.
          # Se calcula sha256/tamaño aquí para que el manifiesto nunca publique
          # un hash viejo si el asset se reemplaza.
          VOZ_URL="https://github.com/${{ github.repository }}/releases/download/modelo-vosk-v1/vosk-es.zip"
          curl -sSfL -o "${RUNNER_TEMP}/vosk-es.zip" "${VOZ_URL}" || {
            echo "::error::No se pudo descargar el modelo Vosk de ${VOZ_URL}. ¿Existe el release modelo-vosk-v1?"
            exit 1
          }
          VOZ_SHA="$(sha256sum "${RUNNER_TEMP}/vosk-es.zip" | cut -d' ' -f1)"
          VOZ_BYTES="$(stat -c%s "${RUNNER_TEMP}/vosk-es.zip")"
          echo "Modelo Vosk: ${VOZ_BYTES} bytes, sha256 ${VOZ_SHA}"
          # Bundle web de este release (misma APK, pero descargable aparte).
          WEB_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/web-v${VERSION_CODE}.zip"
          curl -sSfL -o "${RUNNER_TEMP}/web-v${VERSION_CODE}.zip" "${WEB_URL}" || {
            echo "::error::No se pudo descargar el bundle web de ${WEB_URL}. Revisa que build-release lo haya publicado."
            exit 1
          }
          WEB_SHA="$(sha256sum "${RUNNER_TEMP}/web-v${VERSION_CODE}.zip" | cut -d' ' -f1)"
          WEB_BYTES="$(stat -c%s "${RUNNER_TEMP}/web-v${VERSION_CODE}.zip")"
          echo "Bundle web: v${VERSION_CODE}, ${WEB_BYTES} bytes, sha256 ${WEB_SHA}, apkMinima ${WEB_APK_MINIMA}"
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "apk_url=https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}"
            echo "voz_url=${VOZ_URL}"
            echo "voz_sha=${VOZ_SHA}"
            echo "voz_bytes=${VOZ_BYTES}"
            echo "web_url=${WEB_URL}"
            echo "web_sha=${WEB_SHA}"
            echo "web_bytes=${WEB_BYTES}"
            echo "changelog<<EOF_CHANGELOG"
            printf '%s\n' "${CHANGELOG}"
            echo "EOF_CHANGELOG"
          } >> "${GITHUB_OUTPUT}"

      - name: Actualizar variables en Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_URL: ${{ steps.meta.outputs.apk_url }}
          VOZ_URL: ${{ steps.meta.outputs.voz_url }}
          VOZ_SHA: ${{ steps.meta.outputs.voz_sha }}
          VOZ_BYTES: ${{ steps.meta.outputs.voz_bytes }}
          WEB_URL: ${{ steps.meta.outputs.web_url }}
          WEB_SHA: ${{ steps.meta.outputs.web_sha }}
          WEB_BYTES: ${{ steps.meta.outputs.web_bytes }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
        run: |
          PROJECT_ID="$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            'https://api.vercel.com/v9/projects' | jq -r '.projects[] | select(.name=="mi-quiosco") | .id')"
          if [[ -z "${PROJECT_ID}" ]]; then
            echo "::error::No se encontró el proyecto mi-quiosco en Vercel."
            exit 1
          fi
          echo "PROJECT_ID=${PROJECT_ID}" >> "${GITHUB_ENV}"
          # APP_MIN_VERSION_CODE va en 0 a propósito: la actualización se ofrece
          # como opcional. Cambiarlo a ${VERSION_CODE} la vuelve obligatoria.
          PAYLOAD="$(jq -n \
            --arg code "${VERSION_CODE}" \
            --arg name "${VERSION_NAME}" \
            --arg url "${APK_URL}" \
            --arg log "${CHANGELOG}" \
            --arg vozurl "${VOZ_URL}" \
            --arg vozsha "${VOZ_SHA}" \
            --arg vozbytes "${VOZ_BYTES}" \
            --arg weburl "${WEB_URL}" \
            --arg websha "${WEB_SHA}" \
            --arg webbytes "${WEB_BYTES}" \
            --arg webapk "${WEB_APK_MINIMA}" \
            '[{"key":"APP_LATEST_VERSION_CODE","value":$code},
              {"key":"APP_LATEST_VERSION_NAME","value":$name},
              {"key":"APP_MIN_VERSION_CODE","value":"0"},
              {"key":"APP_APK_URL","value":$url},
              {"key":"APP_VOSK_URL","value":$vozurl},
              {"key":"APP_VOSK_SHA256","value":$vozsha},
              {"key":"APP_VOSK_BYTES","value":$vozbytes},
              {"key":"APP_VOSK_VERSION","value":"v1"},
              {"key":"APP_WEB_VERSION","value":$code},
              {"key":"APP_WEB_APK_MINIMA","value":$webapk},
              {"key":"APP_WEB_URL","value":$weburl},
              {"key":"APP_WEB_SHA256","value":$websha},
              {"key":"APP_WEB_BYTES","value":$webbytes},
              {"key":"APP_CHANGELOG","value":$log}]
              | map(. + {type:"plain", target:["production","preview"]})')"
          RESP="$(curl -sS -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?upsert=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" -d "${PAYLOAD}")"
          FAILED="$(echo "${RESP}" | jq -r '.failed | length')"
          if [[ "${FAILED}" != "0" ]]; then
            echo "::error::Falló el upsert de variables en Vercel: ${RESP}"
            exit 1
          fi
          echo "Variables actualizadas en Vercel."

      - name: Redeploy en Vercel y esperar READY
        # Sin Vercel CLI (se cuelga en CI): la API pública no tiene "redeploy",
        # pero crear un deployment de producción desde git equivale a lo mismo
        # y toma las variables recién actualizadas.
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          DEPLOY_ID="$(curl -sS -X POST 'https://api.vercel.com/v13/deployments' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg p "${PROJECT_ID}" --arg o "${{ github.repository_owner }}" \
              --arg r "${REPO_NAME}" --arg b "${DEFAULT_BRANCH}" \
              '{name:"mi-quiosco", project:$p, target:"production",
                gitSource:{type:"github", org:$o, repo:$r, ref:$b}}')" \
            | jq -r '.id')"
          echo "Deployment: ${DEPLOY_ID}"
          STATE=""
          for i in $(seq 1 40); do
            STATE="$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${DEPLOY_ID}" | jq -r '.status')"
            echo "Intento ${i}: ${STATE}"
            if [[ "${STATE}" == "READY" ]]; then break; fi
            if [[ "${STATE}" == "ERROR" || "${STATE}" == "CANCELED" ]]; then
              echo "::error::El redeploy terminó en estado ${STATE}."
              exit 1
            fi
            sleep 15
          done
          if [[ "${STATE}" != "READY" ]]; then
            echo "::error::Timeout esperando READY (último estado: ${STATE})."
            exit 1
          fi

      - name: Verificar manifiesto en producción
        shell: bash
        env:
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          EXPECTED_VOZ_SHA: ${{ steps.meta.outputs.voz_sha }}
          EXPECTED_WEB_SHA: ${{ steps.meta.outputs.web_sha }}
          BASE_URL: ${{ secrets.SYNC_SERVER_URL }}
        run: |
          sleep 10
          CODE="$(curl -sS "${BASE_URL}/api/app-version" | jq -r '.latestVersionCode')"
          echo "latestVersionCode en producción: ${CODE} (esperado: ${VERSION_CODE})"
          if [[ "${CODE}" != "${VERSION_CODE}" ]]; then
            echo "::error::El manifiesto no refleja la nueva versión."
            exit 1
          fi
          MIN="$(curl -sS "${BASE_URL}/api/app-version" | jq -r '.minVersionCode')"
          echo "minVersionCode en producción: ${MIN} (esperado: 0, actualización opcional)"
          if [[ "${MIN}" != "0" ]]; then
            echo "::error::La actualización se está publicando como obligatoria (minVersionCode=${MIN})."
            exit 1
          fi
          VOZ_SHA="$(curl -sS "${BASE_URL}/api/app-version" | jq -r '.vozModelo.sha256')"
          echo "vozModelo.sha256 en producción: ${VOZ_SHA}"
          if [[ -z "${VOZ_SHA}" || "${VOZ_SHA}" == "null" || "${VOZ_SHA}" != "${EXPECTED_VOZ_SHA}" ]]; then
            echo "::error::El manifiesto no publica el modelo Vosk correcto (APP_VOSK_URL/SHA256/BYTES)."
            exit 1
          fi
          WEB_VERSION="$(curl -sS "${BASE_URL}/api/app-version" | jq -r '.web.version')"
          WEB_SHA="$(curl -sS "${BASE_URL}/api/app-version" | jq -r '.web.sha256')"
          echo "web: version ${WEB_VERSION} (esperado ${VERSION_CODE}), sha256 ${WEB_SHA}"
          if [[ "${WEB_VERSION}" != "${VERSION_CODE}" || "${WEB_SHA}" != "${EXPECTED_WEB_SHA}" ]]; then
            echo "::error::El manifiesto no publica el bundle web de esta versión (APP_WEB_VERSION/URL/SHA256/BYTES)."
            exit 1
          fi
          echo "Manifiesto verificado."
